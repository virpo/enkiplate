<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🪨 enki · Screen picker</title><link rel="stylesheet" href="/web/designs.css"><script type="module" src="/web/designs.js"></script></head>
<body><header class="page-head"><a class="back" href="/">← Back to study</a><div class="headline"><div><h1>Find your screen.</h1><p>Wave washi, 10 clear layouts and 3 lighter Cutouts. Sample appointments.</p></div><div class="live" id="live">Checking Inkplate…</div></div><div class="toolbar"><div class="states" aria-label="Preview state"><button data-state="front" aria-pressed="false">Front</button><button data-state="back" aria-pressed="true">Revealed</button><button data-state="idle" aria-pressed="false">Nothing due</button></div><span id="selection">Current: Cutout</span><button id="restore">Original Cutout</button></div><p id="message" role="status"></p></header>
<main id="grid" aria-label="Screen designs"><p>Rendering the screens…</p></main>
<dialog id="detail"><div class="dialog-head"><div><h2 id="detail-title"></h2><p id="detail-note"></p></div><button id="close" aria-label="Close preview">×</button></div><div class="preview" id="preview"><img id="detail-image" width="600" height="600" alt=""><div id="preview-targets"></div></div><div class="dialog-tools"><button id="previous" aria-label="Previous design">←</button><div class="states"><button data-state="front">Front</button><button data-state="back">Revealed</button><button data-state="idle">Nothing due</button></div><button id="next" aria-label="Next design">→</button></div><div class="dialog-foot"><a id="full-size" target="_blank" rel="noreferrer">600 px image ↗</a><button id="use-detail" class="use">Use on Inkplate</button></div><p class="demo">Demo card · previews keep your study progress intact.</p></dialog>
</body></html>
