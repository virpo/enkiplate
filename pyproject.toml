[project]
name = "enkiplate"
version = "0.2.1"
description = "A physical Japanese study companion for Inkplate 4TEMPERA"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Peter Hraska"}]
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pillow>=11,<13",
  "fsrs>=6,<7",
  "httpx>=0.28,<1",
  "icalendar>=6,<8",
  "recurring-ical-events>=3,<4",
  "pykakasi>=2.3,<3",
  "fonttools[woff]>=4.55,<5",
  "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/virpo/enkiplate"
Repository = "https://github.com/virpo/enkiplate"
Issues = "https://github.com/virpo/enkiplate/issues"

[project.scripts]
enki = "enki_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enki_core"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
